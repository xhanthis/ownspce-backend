name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./internal/... ./cmd/...
      - name: unit tests
        run: go test ./... -count=1
      - name: integration tests
        if: ${{ env.DATABASE_URL != '' }}
        env:
          OWNSPCE_TEST_DB: '1'
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
          GOOGLE_CLIENT_IDS: test-client
        run: go test -race ./internal/httpapi/... -count=1

  migrate:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: go run ./cmd/migrate up
